# Local Redis and Postgres for the rebuild. Optional MinIO when STORAGE_BACKEND=s3.
# Filesystem storage (MEDIA_ROOT) is the default and does not need MinIO.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureai
      POSTGRES_PASSWORD: secureai
      POSTGRES_DB: secureai
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: secureai
      MINIO_ROOT_PASSWORD: secureai-secret
    ports:
      - "9000:9000"
