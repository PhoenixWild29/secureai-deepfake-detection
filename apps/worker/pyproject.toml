[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secureai-worker"
version = "0.2.0"
description = "SecureAI CPU worker. Consumes the shared Redis job queue."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]
