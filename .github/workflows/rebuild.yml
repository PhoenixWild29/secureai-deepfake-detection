name: Rebuild

# Lint, typecheck via next build, and pytest, then build the API and worker
# images. Image jobs are validation only: they do not log in or push.
# Redis and Postgres are service containers. REQUIRE_SERVICES=1 fails the job
# when those tests cannot reach them. S3 is covered with a fake client in
# packages/shared/tests/test_storage.py (no live bucket).

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    # About one minute on recent main runs. 20 minutes covers a cold npm install.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  api:
    name: API import and tests
    runs-on: ubuntu-latest
    # About one minute on recent main runs. 20 minutes covers a cold pip install.
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secureai
          POSTGRES_PASSWORD: secureai
          POSTGRES_DB: secureai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_MODE: dev
      DEV_AUTH_SUBJECT: user_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql+psycopg://secureai:secureai@127.0.0.1:5432/secureai
      QUEUE_BACKEND: redis
      QUEUE_KEY: secureai:jobs:ci
      STORAGE_BACKEND: filesystem
      MEDIA_ROOT: /tmp/secureai-media
      DETECTOR_MODE: cpu
      CORS_ORIGINS: http://localhost:3000
      REQUIRE_SERVICES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-0 libgomp1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install ./apps/worker

      - name: Import check and pytest
        run: |
          PYTHONPATH=apps/api python -c "from app.main import create_app; assert create_app.__name__ == 'create_app'"
          PYTHONPATH=apps/api python -m pytest apps/api/tests packages/shared/tests packages/detector/tests apps/worker/tests -q

  # Build after the API job so a failing unit or API test does not spend a
  # Docker build. Context is the repository root. The API Dockerfile copies
  # packages/shared. The worker Dockerfile copies packages/ (shared and
  # detector) and apps/worker. Each Dockerfile has a sibling .dockerignore
  # that replaces the root file, so legacy weights are not uploaded.
  # Legacy GHCR workflows publish the repository-root Dockerfile only, and
  # only on workflow_dispatch. These tags are not pushed.
  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    # About one minute on recent main runs. 30 minutes covers a cold apt/pip
    # install plus the Actions cache export, whose own limit is 10 minutes.
    # The job does not log in and does not push.
    timeout-minutes: 30
    needs: api
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            tag: secureai-api
          - image: worker
            dockerfile: apps/worker/Dockerfile
            tag: secureai-worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # docker-container is the driver that can export type=gha without the
      # containerd image store. No registry credentials.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      # type=gha uses the runner cache token. pull_request and push may write
      # that cache under the default cache-mode. Separate scopes so the two
      # matrix legs do not replace each other's layers. ignore-error=true
      # keeps a failed cache export from failing this validation build.
      # Workflow permissions stay contents: read. push stays false.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tag }}
          push: "false"
          load: "true"
          provenance: "false"
          sbom: "false"
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
