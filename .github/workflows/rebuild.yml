name: Rebuild

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  api:
    name: API import and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install ./packages/shared ./packages/detector ./apps/worker

      - name: Import check and pytest
        run: |
          PYTHONPATH=apps/api python -c "from app.main import app; assert app.title == 'SecureAI API'"
          PYTHONPATH=apps/api python -m pytest apps/api/tests packages/shared/tests packages/detector/tests apps/worker/tests -q
