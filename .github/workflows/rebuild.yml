name: Rebuild

# Lint, typecheck via next build, and pytest. This workflow does not build Docker images yet.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  api:
    name: API import and tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secureai
          POSTGRES_PASSWORD: secureai
          POSTGRES_DB: secureai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_MODE: dev
      DEV_AUTH_SUBJECT: user_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql+psycopg://secureai:secureai@127.0.0.1:5432/secureai
      QUEUE_BACKEND: redis
      QUEUE_KEY: secureai:jobs:ci
      STORAGE_BACKEND: filesystem
      MEDIA_ROOT: /tmp/secureai-media
      DETECTOR_MODE: cpu
      CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-0 libgomp1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip install ./apps/worker

      - name: Import check and pytest
        run: |
          PYTHONPATH=apps/api python -c "from app.main import create_app; assert create_app.__name__ == 'create_app'"
          PYTHONPATH=apps/api python -m pytest apps/api/tests packages/shared/tests packages/detector/tests apps/worker/tests -q
