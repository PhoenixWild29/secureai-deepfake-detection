[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secureai-shared"
version = "0.2.0"
description = "Shared job contract, Postgres store, and Redis queue"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.14,<3",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<9",
  "boto3>=1.34,<2",
  "cryptography>=41.0.7,<47",
]

[tool.setuptools.packages.find]
where = ["src"]
